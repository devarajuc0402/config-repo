server.port=8080

spring.application.name=api-gateway

api.gateway.app.message=Hello from API Gateway from Config Server

# eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# services uri
spring.cloud.gateway.routes.id=help-service
spring.cloud.gateway.routes.uri=lb://help-service
spring.cloud.gateway.routes.predicates=path=/api/help/**

spring.cloud.gateway.routes.id=restclient-service
spring.cloud.gateway.routes.uri=lb://restclient-service
spring.cloud.gateway.routes.predicates=Path=/api/help/restclient/**

spring.cloud.gateway.routes.id=kafka-service
spring.cloud.gateway.routes.uri=lb://kafka-service
spring.cloud.gateway.routes.predicates=Path=/kafka/**

spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Actuator Info
info.app.name=API Gateway
info.app.description=Spring Cloud API Gateway
info.add.version=1.0.0

# eureka connected logs
logging.level.com.netflix.discovery=DEBUG
logging.level.com.netflix.eureka=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

