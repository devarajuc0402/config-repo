server.port=8082
spring.application.name=restclient-service

restclient.app.message=Hello Restclient from Service Config Server

# without Loadbanced
spring.boot.base.url=http://localhost:8081/api/help
# with Loadbanced
#spring.boot.base.url=http://help-service/api/help

spring.thymeleaf.cache=false
spring.main.show-banner=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG

# registering eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
#management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,env
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.info.env.enabled=true

# Actuator Info
info.app.name=Restclient Service
info.app.description=Spring Boot Restclient Service
info.app.version=1.0.0

# ==================================================================================================================================
# restClient-service circuit breaker 
# ==================================================================================================================================
resilience4j.circuitbreaker.instances.restclientCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.restclientCircuitBreaker.sliding-window-size=2
resilience4j.circuitbreaker.instances.restclientCircuitBreaker.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.restclientCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.restclientCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.restclientCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.restclientCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# ==================================================================================================================================
# Circcuit breaker loggers
# ==================================================================================================================================
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.circuitbreaker=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG

# ==================================================================================================================================
# OAuth2 - Keycloak
# ==================================================================================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/microservices
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG
