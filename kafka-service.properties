server.port=8083
spring.application.name=kafka-service

kafka.app.message=Hello Kafka Service from Config Server

# help-service base url
spring.boot.base.url=http://localhost:8081/api/help

spring.thymeleaf.cache=false
spring.main.show-banner=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG

# Kafka server
spring.kafka.bootstrap-servers=localhost:9092

## Producer
#spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Topic
spring.kafka.topic.name=help-topic
# Consumer
spring.kafka.consumer.group-id=help-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# error handling
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#spring.kafka.consumer.properties.spring.json.trusted.packages=com.org.help.kafka.entity
#spring.kafka.consumer.properties.spring.json.value.default.type=com.org.help.kafka.entity.HelpEntity

# Because producer and consumer package id different
#spring.kafka.consumer.properties.spring.json.use.type.headers=false

# registering eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Actuator Info
info.app.name=Kafka Service
info.app.description=Spring Boot Kafka Service
info.app.version=1.0.0

# ==================================================================================================================================
# OAuth2 - Keycloak
# ==================================================================================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/microservices
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG
